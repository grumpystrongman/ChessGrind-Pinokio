name: Chess Intelligence regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  chess-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STOCKFISH_PATH: /usr/games/stockfish
      CHESSGRIND_SYNC_ON_START: "0"
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install chess test dependencies and Stockfish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          python -m pip install --disable-pip-version-check "chess>=1.11" "requests>=2.31"
      - name: Isolate test data
        run: echo "CHESS_GRIND_HOME=$(mktemp -d)" >> "$GITHUB_ENV"
      - name: Check the 3,006 Academy examples
        run: python academy_quality_audit.py
      - name: Validate claim guard and 27 coaching identities
        run: python tests/test_chess_claim_guard.py
      - name: Install compact Syzygy test corpus
        run: python install_syzygy.py --pieces 4
      - name: Verify exact Syzygy and chess game endgame grading
        run: |
          python -m unittest discover -s tests -p "test_exact_endgames.py" -v
          python -m unittest discover -s tests -p "test_endgame_lab_tablebase.py" -v
      - name: Check legal variations at two engine depths
        run: python chess_quality_benchmark.py
      - name: Validate expanded source and tactical evaluation suites
        run: |
          python -m unittest discover -s tests -p "test_chess_accuracy_suite.py" -v
          python chess_accuracy_suite.py --full
      - name: Upload human-readable benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-quality-benchmark
          path: |
            docs/CHESS_QUALITY_BASELINE.json
            docs/CHESS_ACCURACY_SUITE_REPORT.json
          if-no-files-found: ignore

  windows-pinokio-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out app
        uses: actions/checkout@v4
      - name: Validate Pinokio sync launchers
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./sync-pinokio.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          node --check update.js
          node --check pinokio/update.js
      - name: Set up Python on Windows
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Windows test dependencies
        run: python -m pip install --disable-pip-version-check "chess>=1.11" "requests>=2.31"
      - name: Set isolated test data location
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "ChessGrind-QA"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          "CHESS_GRIND_HOME=$tmp" >> $env:GITHUB_ENV
      - name: Check Windows source compilation
        run: python -m compileall -q pinokio/bootstrap.py chess_knowledge.py verified_chess.py endgame_lab.py install_syzygy.py academy_quality_audit.py conversational_chess.py web_app.py local_ai_setup.py coach_voice.py
      - name: Mock first-time Ollama and neural voice installation
        run: python -m unittest discover -s tests -p "test_local_ai_setup.py" -v
      - name: Check clean Pinokio install orchestration
        run: python -m unittest discover -s tests -p "test_pinokio_provisioning.py" -v
      - name: Verify both Pinokio menu layouts and repair actions
        run: |
          node --check pinokio.js
          node --check pinokio/pinokio.js
          node --check install-ai.js
          node --check pinokio/install-ai.js
          node --check install-voices.js
          node --check pinokio/install-voices.js
          node -e "const names=['./pinokio.js','./pinokio/pinokio.js']; Promise.all(names.map(async x=>{const m=require(x);const links=await m.menu({}, {exists:()=>true,running:()=>false});if(!links.some(k=>k.href==='install-ai.js'))throw Error(x+' lacks AI repair');if(!links.some(k=>k.href==='install-voices.js'))throw Error(x+' lacks voice repair')})).catch(e=>{console.error(e);process.exit(1)})"
      - name: Check all Academy teaching examples
        run: python academy_quality_audit.py
      - name: Check conversation chess-claim rules
        run: python tests/test_chess_claim_guard.py
      - name: Install compact exact endgame data on Windows
        run: python install_syzygy.py --pieces 3
      - name: Verify Windows Syzygy probing and source behavior
        run: python -m unittest discover -s tests -p "test_exact_endgames.py" -v

  windows-full-ai-install:
    if: contains(github.event.head_commit.message, '[full-install-test]')
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CHESSGRIND_INSTALL_MODEL: qwen3.5:0.8b
    steps:
      - name: Check out clean install
        uses: actions/checkout@v4
      - name: Set up Windows Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal ChessGrind voice dependencies
        run: python -m pip install --disable-pip-version-check "chess>=1.11"
      - name: Confirm Authenticode works on this Windows runner
        shell: pwsh
        run: |
          $target = Join-Path $env:SystemRoot "System32/notepad.exe"
          $signed = Get-AuthenticodeSignature -LiteralPath $target -ErrorAction Stop
          Write-Output ("Windows signer inspection: " + $signed.Status)
          if (-not $signed.SignerCertificate) { throw "Windows Authenticode module is unavailable" }
      - name: Install real Ollama, local model and Kokoro speech assets
        run: python local_ai_setup.py install --strict
      - name: Verify a real generated chess reply and RIFF audio
        run: python local_ai_setup.py check
      - name: Assert fully operational local conversational and neural speech services
        run: |
          python -c "from local_ai_setup import readiness; r=readiness(test_voice=True,test_chat=True); print(r); assert r['conversationalAIReady'] and r['neuralVoicesReady']"
